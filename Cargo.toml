[package]
name = "ponx"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ponx"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.22"
petgraph = "0.6"
rand = { version = "0.8.5", features = ["small_rng"] }
approx = "0.5"
indicatif = "0.17"
log = "0.4"
pyo3-log = "0.11.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
