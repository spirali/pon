[package]
name = "ponx"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ponx"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.22.0"
petgraph = "0.6.5"
rand = { version = "0.8.5", features = ["small_rng"] }
approx = "0.5.1"
indicatif = "0.17.8"
